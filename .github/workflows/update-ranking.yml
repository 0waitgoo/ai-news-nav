name: 每周更新软件榜数据

on:
  schedule:
    # 每周一凌晨2点运行 (UTC时间)
    - cron: '0 2 * * 1'
  workflow_dispatch: # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: 运行更新脚本
      run: node scripts/update-ranking.js
      
    - name: 提交更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add api/ranking-data.js
        git diff --quiet && git diff --staged --quiet || git commit -m "自动更新软件榜数据 [$(date +%Y-%m-%d)]"
        git push
